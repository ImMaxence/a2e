server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    # Relative Location headers: keeps https and the domain set by the Coolify proxy.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/rtf;

    include /etc/nginx/snippets/security-headers.conf;

    # ── Legacy URLs (old PHP site) → new routes ──────────────────────────────
    location = /index.php                                    { return 301 /; }
    location = /assainissement-non-collectif.php             { return 301 /prestations/assainissement-non-collectif; }
    location = /autosurveillance-station-epuration.php       { return 301 /prestations/autosurveillance-stations-epuration; }
    location = /zonage-assainissement-carte-aptitude-sols.php { return 301 /prestations/zonage-schema-directeur; }
    location = /eaux-souterraines-piezometre.php             { return 301 /prestations/eaux-souterraines-piezometres; }
    location = /Mesure-odeurs-station-epuration.php          { return 301 /prestations/mesure-odeurs; }
    location = /essais-oxygenation.php                       { return 301 /prestations/essais-oxygenation; }
    location = /essais-garantie-station-epuration.php        { return 301 /prestations/essais-garantie; }
    location = /bilan-24-heures.php                          { return 301 /prestations/rejets-aqueux-bilan-24h; }
    location = /convention-de-rejet-eaux-usees.php           { return 301 /prestations/convention-de-rejet; }
    location = /formation-eaux-ANC-environnement.php         { return 301 /prestations/formations; }
    location = /assainissement-non-collectif-legislation.php { return 301 /reglementation/assainissement-non-collectif; }
    location = /rejet-aqueux-legislation.php                 { return 301 /reglementation/normes-rejets-aqueux; }
    location = /rsde-industriel.php                          { return 301 /reglementation/rsde-rejets-industriels; }
    location = /rsde-station-epuration.php                   { return 301 /reglementation/rsde-stations-epuration; }
    location = /references.php                               { return 301 /references; }
    location = /formulaire.php                               { return 301 /contact; }
    location = /espace_client.php                            { return 301 /espace-client; }
    location = /mentions_legales.php                         { return 301 /mentions-legales; }
    location = /sitemap.php                                  { return 301 /prestations; }

    # ── Caching ──────────────────────────────────────────────────────────────
    # Hashed bundles: cache forever.
    location ~* "-[A-Za-z0-9_]{8,}\.(?:js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /images/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location ^~ /docs/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
