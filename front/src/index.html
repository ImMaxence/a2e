<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>A2E Environnement — Ingénierie de l'eau et de l'environnement</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f8fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#05121c" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply the stored theme and language before Angular boots to avoid a flash.
    (function () {
      try {
        var theme = localStorage.getItem('a2e.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        var lang = localStorage.getItem('a2e.lang');
        if (lang) document.documentElement.lang = lang;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
