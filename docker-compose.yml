# Production stack, deployed with Coolify.
# Coolify's proxy routes the domain to the container port: no host port is published here.
# Local test (http://localhost:8088): docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
